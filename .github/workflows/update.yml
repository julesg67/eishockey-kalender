name: Update Eishockey Calendars
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate calendars
        run: python update_calendar.py

      - name: Commit updated calendars
        run: |
          if [[ -n "$(git status --porcelain *.ics)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add *.ics
            git commit -m "Update public team calendars"
            git push
          else
            echo "No calendar changes."
          fi
